[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term-missing --cov-fail-under=100"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "unit: юнит-тесты без БД",
    "integration: тесты API через TestClient на реальной БД",
    "db: тесты схемы, миграций и ограничений PostgreSQL",
    "e2e: сквозные тесты по HTTP на запущенном сервере",
]

[tool.coverage.run]
branch = true
source = ["app", "alembic"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF"]

# Кириллица в комментариях и строках не ошибка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["app", "alembic/env.py"]
plugins = ["pydantic.mypy"]
strict = true
